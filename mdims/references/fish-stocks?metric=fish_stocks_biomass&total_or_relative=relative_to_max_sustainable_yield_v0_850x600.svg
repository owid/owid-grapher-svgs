<a id="title" href="https://ourworldindata.org/grapher/fish-stocks-relative-to-the-maximum-sustainable-yield">
<g class="markdown-text-wrap">
<text x="16" y="39.77" font-family="&#x27;Playfair Display&#x27;, Georgia, &#x27;Times New Roman&#x27;, &#x27;Liberation Serif&#x27;, serif" style="font-size:24.5px;font-weight:600;line-height:1.2" fill="#2d2e2d"><tspan x="16" y="39.77">Fish stocks relative to the maximum sustainable yield<tspan dx="1.6799999999999997" xml:space="preserve" font-size="18" font-weight="700" font-family="Lato, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, &#x27;Liberation Sans&#x27;, sans-serif" fill="#767676"> 1955 to 2013</tspan></tspan></text>
</g>
</a>
<g id="subtitle" class="markdown-text-wrap">
<text x="16" y="65.95" style="font-size:15px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="65.95">Fish stocks are measured by their biomass: the number of individuals multiplied by their mass.</tspan><tspan x="16" y="83.95">Here it&#x27;s measured as the biomass of a fish stock divided by the biomass at its maximum sustainable yield – the</tspan><tspan x="16" y="101.95">level at which we can catch the maximum amount of fish without a decline in fish populations. A value of one</tspan><tspan x="16" y="119.95">maximizes fish catch without decreasing fish populations.</tspan></text>
</g>
</g>
