<a id="title" href="https://ourworldindata.org/grapher/fishing-intensity-relative-to-the-maximum-sustainable-yield">
<g class="markdown-text-wrap">
<text x="16" y="37.83" font-family="&#x27;Playfair Display&#x27;, Georgia, &#x27;Times New Roman&#x27;, &#x27;Liberation Serif&#x27;, serif" style="font-size:22.5px;font-weight:600;line-height:1.2" fill="#2d2e2d"><tspan x="16" y="37.83">Fishing intensity relative to the maximum sustainable yield<tspan dx="1.6799999999999997" xml:space="preserve" font-size="18" font-weight="700" font-family="Lato, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, &#x27;Liberation Sans&#x27;, sans-serif" fill="#767676"> 1956 to 2012</tspan></tspan></text>
</g>
</a>
<g id="subtitle" class="markdown-text-wrap">
<text x="16" y="63.55" style="font-size:15px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="63.55">Fishing intensity measured the extent to which a stock is being exploited. This is the fraction of the fish</tspan><tspan x="16" y="81.55">population that is caught in a given year.</tspan><tspan x="16" y="99.55">Here it&#x27;s measured as the intensity divided by the intensity at the maximum sustainable yield – the level at</tspan><tspan x="16" y="117.55">which we can catch the maximum amount of fish without a decline in fish populations. A value of one is the</tspan><tspan x="16" y="135.55">optimal level to maximize fish catch without declining populations. Greater than one suggests overfishing.</tspan></text>
</g>
</g>
