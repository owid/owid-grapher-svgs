<svg xmlns="http://www.w3.org/2000/svg" version="1.1" font-family="Lato, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, &#x27;Liberation Sans&#x27;, sans-serif" font-size="14" style="font-feature-settings:&quot;liga&quot;, &quot;kern&quot;, &quot;calt&quot;, &quot;lnum&quot;;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;background-color:#fff" width="300" height="160" viewBox="0 0 300 160">
<defs>
<style>@import url(https://ourworldindata.org/fonts.css)</style>
</defs>
<g id="chart-area" style="pointer-events:none">
<defs>
<pattern id="noDataPattern" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(-45 2 2) scale(0.75)">
<path d="M -1,2 l 6,0" stroke="#ccc" stroke-width="0.7">
</path>
</pattern>
</defs>
<line id="vertical-zero-line" x1="81.52" y1="152" x2="81.52" y2="8" stroke="#999" stroke-width="0.5">
</line>
<g id="bars">
<rect id="World" x="0" y="0" transform="translate(81.77, 11.6)" width="146.15" height="13.37" fill="#18470f" opacity="0.8" style="transition:height 200ms ease">
</rect>
<rect id="Asia" x="0" y="0" transform="translate(81.77, 32.17)" width="86.27" height="13.37" fill="#00847e" opacity="0.8" style="transition:height 200ms ease">
</rect>
<rect id="Africa" x="0" y="0" transform="translate(81.77, 52.74)" width="26.73" height="13.37" fill="#a2559c" opacity="0.8" style="transition:height 200ms ease">
</rect>
<rect id="Europe" x="0" y="0" transform="translate(81.77, 73.31)" width="13.49" height="13.37" fill="#4c6a9c" opacity="0.8" style="transition:height 200ms ease">
</rect>
<rect id="North-America" x="0" y="0" transform="translate(81.77, 93.89)" width="11" height="13.37" fill="#c4523e" opacity="0.8" style="transition:height 200ms ease">
</rect>
<rect id="South-America" x="0" y="0" transform="translate(81.77, 114.46)" width="7.82" height="13.37" fill="#883039" opacity="0.8" style="transition:height 200ms ease">
</rect>
<rect id="Oceania" x="0" y="0" transform="translate(81.77, 135.03)" width="0.82" height="13.37" fill="#9a5129" opacity="0.8" style="transition:height 200ms ease">
</rect>
</g>
<g id="value-labels">
<text x="0" y="0" transform="translate(232.93, 18.29)" fill="#5b5b5b" dy=".32em" text-anchor="start" opacity="1" font-size="10.5" font-weight="400">8.09 billion<tspan fill="#999"></tspan></text>
<text x="0" y="0" transform="translate(173.05, 38.86)" fill="#5b5b5b" dy=".32em" text-anchor="start" opacity="1" font-size="10.5" font-weight="400">4.78 billion<tspan fill="#999"></tspan></text>
<text x="0" y="0" transform="translate(113.5, 59.43)" fill="#5b5b5b" dy=".32em" text-anchor="start" opacity="1" font-size="10.5" font-weight="400">1.48 billion<tspan fill="#999"></tspan></text>
<text x="0" y="0" transform="translate(100.27, 80)" fill="#5b5b5b" dy=".32em" text-anchor="start" opacity="1" font-size="10.5" font-weight="400">747 million<tspan fill="#999"></tspan></text>
<text x="0" y="0" transform="translate(97.77, 100.57)" fill="#5b5b5b" dy=".32em" text-anchor="start" opacity="1" font-size="10.5" font-weight="400">609 million<tspan fill="#999"></tspan></text>
<text x="0" y="0" transform="translate(94.6, 121.14)" fill="#5b5b5b" dy=".32em" text-anchor="start" opacity="1" font-size="10.5" font-weight="400">433 million<tspan fill="#999"></tspan></text>
<text x="0" y="0" transform="translate(87.6, 141.71)" fill="#5b5b5b" dy=".32em" text-anchor="start" opacity="1" font-size="10.5" font-weight="400">45.6 million<tspan fill="#999"></tspan></text>
</g>
<g id="entity-labels">
<text x="76.77" y="22.17" text-anchor="end" font-size="10.5" opacity="1"><tspan x="76.77" font-weight="700" fill="#5b5b5b">World</tspan></text>
<text x="76.77" y="42.74" text-anchor="end" font-size="10.5" opacity="1"><tspan x="76.77" font-weight="700" fill="#5b5b5b">Asia</tspan></text>
<text x="76.77" y="63.31" text-anchor="end" font-size="10.5" opacity="1"><tspan x="76.77" font-weight="700" fill="#5b5b5b">Africa</tspan></text>
<text x="76.77" y="83.89" text-anchor="end" font-size="10.5" opacity="1"><tspan x="76.77" font-weight="700" fill="#5b5b5b">Europe</tspan></text>
<text x="76.77" y="104.46" text-anchor="end" font-size="10.5" opacity="1"><tspan x="76.77" font-weight="700" fill="#5b5b5b">North America</tspan></text>
<text x="76.77" y="125.03" text-anchor="end" font-size="10.5" opacity="1"><tspan x="76.77" font-weight="700" fill="#5b5b5b">South America</tspan></text>
<text x="76.77" y="145.6" text-anchor="end" font-size="10.5" opacity="1"><tspan x="76.77" font-weight="700" fill="#5b5b5b">Oceania</tspan></text>
</g>
