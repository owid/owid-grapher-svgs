<g id="subtitle" class="markdown-text-wrap">
<text x="16" y="67.74" style="font-size:12px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="67.74">Mismanaged plastic waste is waste that is not recycled,</tspan><tspan x="16" y="82.14">incinerated, or kept in sealed landfills. It includes</tspan><tspan x="16" y="96.54">materials burned in open pits, dumped into seas or open</tspan><tspan x="16" y="110.94">waters, or disposed of in unsanitary landfills and</tspan><tspan x="16" y="125.34">dumpsites.</tspan></text>
</g>
