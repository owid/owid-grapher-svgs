<g id="subtitle" class="markdown-text-wrap">
<text x="16" y="73.74" style="font-size:12px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="73.74">The index captures to which extent LGBT+ people have</tspan><tspan x="16" y="88.14">the same rights as straight and cisgender people. It</tspan><tspan x="16" y="102.54">combines 15 individual policies, such as the legality of</tspan><tspan x="16" y="116.94">same-sex relationships, marriage, and gender marker</tspan><tspan x="16" y="131.34">changes. It ranges from 0 to 100 (most equal).</tspan></text>
</g>
