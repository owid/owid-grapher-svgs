<g id="subtitle" class="markdown-text-wrap">
<text x="16" y="66.55" style="font-size:15px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="66.55">Displayed is the percentage of survey respondents who approved of wives working when asked the question:</tspan><tspan x="16" y="84.55">&quot;Do you approve or disapprove of a married woman earning money in business or industry if she has a husband</tspan><tspan x="16" y="102.55">capable of supporting her?&quot;</tspan></text>
</g>
