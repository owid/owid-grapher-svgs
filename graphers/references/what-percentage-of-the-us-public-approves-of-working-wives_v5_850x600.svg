<g id="note" class="markdown-text-wrap">
<text x="16" y="549.81" style="font-size:13px;line-height:1.2"><tspan x="16" y="549.81"><tspan style="font-weight:700" x="16" y="549.81">Note:</tspan><tspan dy="0.01" xml:space="preserve"> In some years, the poll question varied slightly. For example, in 1936 participants were asked: &quot;Should a married woman earn money if</tspan></tspan><tspan x="16" y="565.41">she has a husband capable of supporting her?&quot; All variations of the survey question, which itself reveals social norms of the time, stopped being</tspan><tspan x="16" y="581.01">asked after 1998.</tspan></text>
