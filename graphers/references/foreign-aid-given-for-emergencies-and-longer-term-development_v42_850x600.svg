<g id="subtitle" class="markdown-text-wrap">
<text x="16" y="92.95" style="font-size:15px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="92.95">Committed bilateral <tspan class="dod-span" data-id="oda">official development assistance (ODA)</tspan> from governments and multilateral organizations, grants from</tspan><tspan x="16" y="110.95">civil society organizations. Aid for emergencies, such as natural disasters and wars, is often called humanitarian aid. This</tspan><tspan x="16" y="128.95">data is expressed in US dollars and adjusted for inflation.</tspan></text>
