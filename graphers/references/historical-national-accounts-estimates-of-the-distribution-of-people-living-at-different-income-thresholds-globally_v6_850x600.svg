<g class="markdown-text-wrap">
<text x="16" y="36.86" font-family="&#x27;Playfair Display&#x27;, Georgia, &#x27;Times New Roman&#x27;, &#x27;Liberation Serif&#x27;, serif" style="font-size:21.5px;font-weight:600;line-height:1.2" fill="#2d2e2d"><tspan x="16" y="36.86">Historical national accounts estimates of the distribution of people living</tspan><tspan x="16" y="62.66">at different income thresholds globally</tspan></text>
</g>
</a>
<g id="subtitle" class="markdown-text-wrap">
<text x="16" y="88.15" style="font-size:15px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="88.15">Average incomes measured in national accounts are often much higher than those observed in survey data. As such the</tspan><tspan x="16" y="106.15">poverty rates shown are lower than corresponding estimates based on survey data – this includes the official estimates</tspan><tspan x="16" y="124.15">produced by the World Bank used to monitor progress against SDG1. See Roser and Hasell (2021) for further discussion.</tspan></text>
</g>
