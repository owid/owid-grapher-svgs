<text x="16" y="549.81" style="font-size:13px;line-height:1.2"><tspan x="16" y="549.81"><tspan style="font-weight:700" x="16" y="549.81">Note:</tspan><tspan dy="0.01" xml:space="preserve"> Polymer types are as follows: Acrylonitrile Butadiene (AB), Acrylonitrile Styrene Acrylate (ASA), Styrene Acrylonitrile (SAN),</tspan></tspan><tspan x="16" y="565.41">Polyurethane (PUR), Polyvinyl Chloride (PVC), Polystyrene (PS), Linear Low-Density Polyethylene (LLDPE), Polypropylene (PP), Polyethylene</tspan><tspan x="16" y="581.01">Terephthalate (PET), High-Density Polyethylene (HDPE).</tspan></text>
