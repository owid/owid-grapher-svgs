<g id="subtitle" class="markdown-text-wrap">
<text x="16" y="66.55" style="font-size:15px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="66.55">Natural resources rents are estimated as the difference between the price of a commodity and the average cost</tspan><tspan x="16" y="84.55">of producing it. Total natural resources rents are the sum of oil rents, natural gas rents, coal rents, mineral rents,</tspan><tspan x="16" y="102.55">and forest rents.</tspan></text>
