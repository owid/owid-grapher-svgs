</g>
</a>
<g id="subtitle" class="markdown-text-wrap">
<text x="16" y="66.55" style="font-size:15px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="66.55">Increased risk of developing alcohol dependency or abuse in individuals with a given mental health disorder</tspan><tspan x="16" y="84.55">relative to those without. A value of 3.2 for PTSD, for example, would indicate that individuals with PTSD are</tspan><tspan x="16" y="102.55">3.2 times as likely to develop alcohol dependency relative to those without.</tspan></text>
</g>
