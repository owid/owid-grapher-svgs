<g class="markdown-text-wrap">
<text x="16" y="40.25" font-family="&#x27;Playfair Display&#x27;, Georgia, &#x27;Times New Roman&#x27;, &#x27;Liberation Serif&#x27;, serif" style="font-size:25px;font-weight:600;line-height:1.2" fill="#2d2e2d"><tspan x="16" y="40.25">Rock-to-metal ratios of mined materials</tspan></text>
</g>
</a>
<g id="subtitle" class="markdown-text-wrap">
<text x="16" y="66.55" style="font-size:15px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="66.55">The quantity of rock that has to be mined to produce one unit of metal. For example, a ratio of 50 means that</tspan><tspan x="16" y="84.55">50 kilograms of rock has to be mined to produce one kilogram of that metal.</tspan></text>
</g>
