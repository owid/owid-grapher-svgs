<g id="subtitle" class="markdown-text-wrap">
<text x="16" y="66.55" style="font-size:15px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="66.55">The series World ILO-EPEAP, as well as the series for England and Italy, cover working children aged 10-14. The</tspan><tspan x="16" y="84.55">series for the US covers working children aged 10-13. The series World ILO-IPEC covers children aged 5-17.</tspan></text>
