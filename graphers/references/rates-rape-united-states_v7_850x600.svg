<g class="markdown-text-wrap">
<text x="16" y="40.25" font-family="&#x27;Playfair Display&#x27;, Georgia, &#x27;Times New Roman&#x27;, &#x27;Liberation Serif&#x27;, serif" style="font-size:25px;font-weight:600;line-height:1.2" fill="#2d2e2d"><tspan x="16" y="40.25">Estimated number of rapes per 100,000 in the United States</tspan></text>
</g>
</a>
<g id="subtitle" class="markdown-text-wrap">
<text x="16" y="66.55" style="font-size:15px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="66.55">In 2013, the FBI changed its definition of rape within its crime reporting program. The legacy definition was</tspan><tspan x="16" y="84.55">narrower, and only included the forcible penetration of females without consent. The revised definition includes</tspan><tspan x="16" y="102.55">male and non-binary victims, and a broader criteria of crimes, including non-consensual oral or anal sex, or</tspan><tspan x="16" y="120.55">sexual assault with an object.</tspan></text>
</g>
