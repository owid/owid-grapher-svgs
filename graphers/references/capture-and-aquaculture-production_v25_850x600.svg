<g id="subtitle" class="markdown-text-wrap">
<text x="16" y="66.55" style="font-size:15px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="66.55">Aquaculture is the farming of aquatic organisms including fish, molluscs, crustaceans and aquatic plants. Capture</tspan><tspan x="16" y="84.55">fishery production is the volume of wild fish catches landed for all commercial, industrial, recreational and</tspan><tspan x="16" y="102.55">subsistence purposes.</tspan></text>
