</g>
</a>
<g id="subtitle" class="markdown-text-wrap">
<text x="16" y="91.15" style="font-size:15px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="91.15">Share of women (% of adult population), who are underweight, healthy/normal, overweight or obese based on body mass</tspan><tspan x="16" y="109.15">index (BMI). Body Mass Index (BMI) is a person&#x27;s weight divided by their height squared. The WHO define a BMI &lt;=18.5 as</tspan><tspan x="16" y="127.15">underweight; 18.6 to 25.0 as normal/healthy; 25.1 to 30 as overweight; and &gt;30.0 as obese.</tspan></text>
</g>
