<text x="16" y="66.55" style="font-size:15px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="66.55">Landings represent aquatic animals that are caught and brought ashore for use. Discards are animals thrown</tspan><tspan x="16" y="84.55">back, alive or dead, into the sea after being caught during fishing activities.</tspan></text>
