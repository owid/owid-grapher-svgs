<g id="subtitle" class="markdown-text-wrap">
<text x="16" y="66.55" style="font-size:15px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="66.55">Total economic cost of damages as a result of global natural disasters in any given year, measured in current</tspan><tspan x="16" y="84.55">US$. Includes those from drought, floods, extreme weather, extreme temperature, landslides, dry mass</tspan><tspan x="16" y="102.55">movements, wildfires, volcanic activity and earthquakes.</tspan></text>
