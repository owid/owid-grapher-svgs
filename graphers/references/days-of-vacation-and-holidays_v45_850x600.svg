<text x="16" y="565.41" style="font-size:13px;line-height:1.2"><tspan x="16" y="565.41"><tspan style="font-weight:700" x="16" y="565.41">Note:</tspan><tspan dy="0.01" xml:space="preserve"> In addition to vacations and holidays, workers had regular days off each week. Huberman and Minns estimated these numbers as 1 day</tspan></tspan><tspan x="16" y="581.01">each week from 1870–1913, 1.5 days from 1929–1950, and 2 days from 1960–2000.</tspan></text>
