<g id="subtitle" class="markdown-text-wrap">
<text x="16" y="66.55" style="font-size:15px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="66.55">Bilateral <tspan class="dod-span" data-id="net-oda">net</tspan> <tspan class="dod-span" data-id="oda">official development assistance (ODA)</tspan> represents flows from government sources directly to the</tspan><tspan x="16" y="84.55">recipient country. Multilateral ODA flows from governments to multilateral agencies, which use them to fund</tspan><tspan x="16" y="102.55">their own developmental programs. This data is expressed in US dollars and adjusted for inflation.</tspan></text>
