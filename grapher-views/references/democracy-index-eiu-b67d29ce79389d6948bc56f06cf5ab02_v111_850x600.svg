</g>
</a>
<g id="subtitle" class="markdown-text-wrap">
<text x="16" y="66.55" style="font-size:15px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="66.55">Data by the <tspan class="dod-span" data-id="economist-intelligence-unit">Economist Intelligence Unit</tspan>. Expert estimates of the extent to which citizens can choose their</tspan><tspan x="16" y="84.55">political leaders in free and fair elections, enjoy civil liberties, prefer democracy over other political systems, can</tspan><tspan x="16" y="102.55">and do participate in politics, and have a functioning government that acts on their behalf. The index ranges</tspan><tspan x="16" y="120.55">from 0 to 10 (most democratic).</tspan></text>
</g>
