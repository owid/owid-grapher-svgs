<g id="subtitle" class="markdown-text-wrap">
<text x="16" y="63.55" style="font-size:15px;line-height:1.2" fill="#5b5b5b"><tspan x="16" y="63.55">Percentage of children aged 5–14 in child labor. The narrower definition (blue) counts only economic activity;</tspan><tspan x="16" y="81.55">the broader definition (red) also counts unpaid household chores, such as cooking, cleaning, and childcare,</tspan><tspan x="16" y="99.55">performed for at least 21 hours a week.</tspan></text>
