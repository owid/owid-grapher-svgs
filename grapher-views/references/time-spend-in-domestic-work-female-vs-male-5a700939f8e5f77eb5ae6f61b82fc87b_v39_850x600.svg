<g id="note" class="markdown-text-wrap">
<text x="16" y="549.81" style="font-size:13px;line-height:1.2"><tspan x="16" y="549.81"><tspan style="font-weight:700" x="16" y="549.81">Note:</tspan><tspan dy="0.01" xml:space="preserve"> Unpaid care and domestic work includes: food preparation, dishwashing, upkeep of a dwelling, laundry, ironing, gardening, caring for</tspan></tspan><tspan x="16" y="565.41">pets, shopping, servicing and repair of personal and household goods, childcare, and care of the sick, elderly or disabled household members,</tspan><tspan x="16" y="581.01">among others. Where data for 2000 is unavailable, the value from the closest year between 2001 and 2010 is shown instead.</tspan></text>
